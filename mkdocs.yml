site_name: VerveStacks Documentation
site_description: Documentation for VerveStacks — open-use, ready-to-run power-sector energy system models for 100+ countries
site_url: https://kanors-emr.github.io/VerveStacks-docs/
docs_dir: docs
site_author: KanORS

repo_url: https://github.com/kanors-emr/VerveStacks-docs/issues
repo_name: Report a documentation issue
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  logo: images/brand/kanors-logo-white.png
  favicon: images/brand/kanors-favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      lang: en
  - table-reader:
      data_path: docs

extra_css:
  - _static/custom.css
  - stylesheets/extra.css

extra_javascript:
  - _static/image-lightbox.js
  - _static/smooth-anchor.js
  - javascripts/hero-spotlight.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kanors-emr
      name: KanORS on GitHub
    - icon: fontawesome/solid/globe
      link: https://www.kanors-emr.org/
      name: KanORS website

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

copyright: "&copy; KanORS-EMR, 2026"

not_in_nav: |
  /case-studies/
  /integration/
  /platform/queue-management.md
  /tutorials/multi-iso-analysis.md

